[project]
name = "provenance-api"
version = "0.1.0"
description = "ML text-classification service: FastAPI, PostgreSQL, Redis job queue, Stripe test mode"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kerwin Postrero", email = "197677158+PosKa343@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.2",
    "joblib>=1.6.0",
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "scikit-learn>=1.9.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "textstat>=0.7.13",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify,
# S bandit security checks, RUF ruff-specific.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# pytest relies on bare assert, and tests use fixed fake passwords and secrets.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
# Lets mypy understand that settings fields can come from environment variables.
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["provenance_api"]
branch = true
# SQLAlchemy's async layer runs on greenlets; without this, lines after an await are missed.
concurrency = ["greenlet", "thread"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
]

# These libraries ship no type information.
[[tool.mypy.overrides]]
module = ["nltk.*", "textstat.*", "sklearn.*", "joblib.*"]
ignore_missing_imports = true
