[project]
name = "provenance-api"
version = "0.1.0"
description = "ML text-classification service: FastAPI, PostgreSQL, Redis job queue, Stripe test mode"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kerwin Postrero", email = "197677158+PosKa343@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "textstat>=0.7.13",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify,
# S bandit security checks, RUF ruff-specific.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# pytest relies on bare assert.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["provenance_api"]
branch = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

# These libraries ship no type information.
[[tool.mypy.overrides]]
module = ["nltk.*", "textstat.*", "sklearn.*", "joblib.*"]
ignore_missing_imports = true
