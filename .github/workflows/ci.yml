name: CI

on:
  push:
  pull_request:

# A newer push to a branch cancels that branch's older run. Runs on main are
# never cancelled, and push and pull_request runs are kept in separate groups:
# a pull_request run that starts just after its PR merges reports main as its
# ref, and used to cancel the run on main.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Download NLTK data
        run: uv run provenance-api nltk-data
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up --build --detach
      - name: Wait for the API
        run: |
          for attempt in $(seq 1 30); do
            curl --silent --fail http://localhost:8000/healthz && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Register, log in, classify and run a batch job through the running stack
        run: |
          python3 scripts/smoke_test.py http://localhost:8000 \
            --upgrade-command 'docker compose exec -T api provenance-api set-plan {email} pro'
      - name: Check the predictions were stored (one single, two from the batch)
        run: |
          count=$(docker compose exec -T postgres psql -U provenance -d provenance -tAc 'SELECT count(*) FROM predictions')
          test "$count" = "3"
      - name: Check readiness, metrics and structured logs
        run: |
          curl --silent --fail http://localhost:8000/readyz
          curl --silent --fail http://localhost:8000/metrics | grep --quiet 'http_request_duration_seconds_count{method="POST",route="/v1/classify",status="200"}'
          curl --silent --fail http://localhost:9100/metrics | grep --quiet 'jobs_finished_total{status="succeeded"} 1.0'
          # Every line the API and worker wrote must be a JSON object.
          docker compose logs api worker --no-log-prefix | python3 -c "
          import json, sys
          lines = [line for line in sys.stdin if line.strip()]
          events = [json.loads(line) for line in lines]
          assert any(e.get('event') == 'request' and 'request_id' in e for e in events), 'no access log line'
          assert any('job_id' in e for e in events), 'no worker line tagged with a job id'
          print(len(events), 'log lines, all JSON')
          "
      - name: Check the API shuts down cleanly on SIGTERM
        run: |
          docker compose stop api
          docker compose logs api --no-log-prefix | grep --quiet 'Application shutdown complete.'
          docker compose start api
      - name: Check the container does not run as root
        run: test "$(docker compose exec -T api id -u)" != "0"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
