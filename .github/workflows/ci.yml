name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Download NLTK data
        run: uv run provenance-api nltk-data
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up --build --detach
      - name: Wait for the API
        run: |
          for attempt in $(seq 1 30); do
            curl --silent --fail http://localhost:8000/healthz && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Register, log in, classify and run a batch job through the running stack
        run: |
          python3 scripts/smoke_test.py http://localhost:8000 \
            --upgrade-command 'docker compose exec -T api provenance-api set-plan {email} pro'
      - name: Check the predictions were stored (one single, two from the batch)
        run: |
          count=$(docker compose exec -T postgres psql -U provenance -d provenance -tAc 'SELECT count(*) FROM predictions')
          test "$count" = "3"
      - name: Check the container does not run as root
        run: test "$(docker compose exec -T api id -u)" != "0"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
